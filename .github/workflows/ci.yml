name: CI

# What this checks, and why each job exists:
#
#   suites    the four test suites under ctest, on Linux and macOS. The
#             differential suite needs a version 1.0 binary to compare
#             against, which is built here from the master branch -- so the
#             "byte identical to 1.0" claim is re-established on every push
#             rather than resting on a binary someone built once.
#   makefile  the plain Makefile paths. CMake is what the suites job uses, so
#             without this job `make -C src` could rot unnoticed, and it is
#             what a user without CMake will reach for.
#   example   the distributed example reproduces its own tracked output. This
#             catches a change in what the program writes before a reader
#             finds the shipped example disagreeing with the program.
#   windows   the suites that do not need a 1.0 reference, under MSYS2/MINGW64
#             -- the toolchain a Windows user actually has -- plus the
#             distributed example, whose committed output was generated
#             elsewhere and so pins this build's numbers to another platform's.
#             The differential suite is skipped there for a reason given in
#             the job.
#   manual    the manual builds from source, and its generated option
#             reference agrees with the option table.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: suites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Full history: the 1.0 reference is built from the master branch, so a
      # shallow clone of the feature branch alone is not enough.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          set -euxo pipefail
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update
            # gsl is for the 1.0 reference only; 2.0 requires none of it.
            sudo apt-get install -y libgsl-dev zlib1g-dev
          else
            brew install gsl
          fi

      # 1.0 predates the include-what-you-use tightening in current standard
      # libraries, so the headers it relied on transitively are forced in and
      # its warnings silenced. The shim adds nothing where they are already
      # included, and it does not patch master.
      - name: Build the version 1.0 reference binary
        run: |
          set -euxo pipefail
          mkdir -p ref10
          git archive origin/master src | tar -x -C ref10
          if [ "$RUNNER_OS" = "Linux" ]; then
            GSL_INC=/usr/include
            GSL_LIB=/usr/lib/x86_64-linux-gnu
          else
            GSL_INC="$(brew --prefix gsl)/include"
            GSL_LIB="$(brew --prefix gsl)/lib"
          fi
          # LINK_OPTS is overridden to record an rpath: 1.0's Makefile links
          # with -L alone, which is enough to link but not always to run --
          # a libgsl whose install name is rpath-relative (Homebrew, conda)
          # then fails at load time. Running the binary below is the check.
          make -C ref10/src \
            G++FLAG="-O2 -std=c++03 -w -include cstring -include cstdlib -include climits" \
            I_PATH="$GSL_INC" \
            L_PATH="$GSL_LIB" \
            LINK_OPTS="-L$GSL_LIB -Wl,-rpath,$GSL_LIB -lgsl -lgslcblas"
          REF=ref10/src/adze-1.0
          # 1.0 exits nonzero when run with no arguments (it wants a paramfile),
          # so its exit status cannot be the check that it loaded -- and under
          # pipefail, piping it into head would fail the step. The banner is the
          # evidence: a binary that cannot find its libgsl prints a loader error
          # instead.
          out=$("./$REF" 2>&1 || true)
          echo "${out%%$'\n'*}"                       # first line, no pipe
          case "$out" in
            *"Allelic Diversity Analyzer"*) ;;
            *) echo "the reference binary did not run:"
               printf '%s\n' "$out" | head -3
               exit 1 ;;
          esac

      # OpenMP is optional. The Linux runner has it through GCC, so the
      # thread-invariance case runs there; macOS AppleClang carries no libomp
      # by default, and that case reports itself skipped rather than failing.
      - name: Configure and build
        run: |
          set -euxo pipefail
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DADZE_REFERENCE="$PWD/ref10/src/adze-1.0"
          cmake --build build -j
          ./build/adze --version

      - name: Run the suites
        run: ctest --test-dir build --output-on-failure

      # The suites leave their scratch directories in place on failure; both
      # sides of every differing file are in there, which is the difference
      # between diagnosing a remote failure and guessing at it.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: scratch-${{ matrix.os }}
          path: |
            build/regress
            build/formats
            build/windows
          if-no-files-found: ignore

  makefile:
    name: plain make
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y libgsl-dev zlib1g-dev

      # Three configurations, because the optional features are compiled in
      # rather than detected at runtime: a bare build, one with zlib, and one
      # with both zlib and OpenMP.
      - name: Build every configuration
        run: |
          set -euxo pipefail
          make -C src
          ./src/adze --version
          make -C src clean
          make -C src ZLIB=1
          make -C src clean
          make -C src ZLIB=1 OPENMP=1
          ./src/adze --version

      - name: Build the version 1.0 reference binary
        run: |
          set -euxo pipefail
          git fetch --no-tags --depth=1 origin master
          mkdir -p ref10
          git archive FETCH_HEAD src | tar -x -C ref10
          make -C ref10/src \
            G++FLAG="-O2 -std=c++03 -w -include cstring -include cstdlib -include climits" \
            I_PATH=/usr/include \
            L_PATH=/usr/lib/x86_64-linux-gnu \
            LINK_OPTS="-L/usr/lib/x86_64-linux-gnu -Wl,-rpath,/usr/lib/x86_64-linux-gnu -lgsl -lgslcblas"
          REF=ref10/src/adze-1.0
          # 1.0 exits nonzero when run with no arguments (it wants a paramfile),
          # so its exit status cannot be the check that it loaded -- and under
          # pipefail, piping it into head would fail the step. The banner is the
          # evidence: a binary that cannot find its libgsl prints a loader error
          # instead.
          out=$("./$REF" 2>&1 || true)
          echo "${out%%$'\n'*}"                       # first line, no pipe
          case "$out" in
            *"Allelic Diversity Analyzer"*) ;;
            *) echo "the reference binary did not run:"
               printf '%s\n' "$out" | head -3
               exit 1 ;;
          esac

      # Run directly rather than through ctest, so this job needs nothing but
      # make and python3.
      - name: Run the suites against the Makefile build
        run: |
          set -euxo pipefail
          python3 test/docs.py
          python3 test/regress.py --candidate src/adze --reference ref10/src/adze-1.0
          python3 test/formats.py --candidate src/adze
          python3 test/windows.py --candidate src/adze

  example:
    name: distributed example
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y zlib1g-dev

      - name: Build
        run: make -C src ZLIB=1

      # The run summary records how long each phase took, so it cannot match
      # between machines; every file whose contents are results is compared.
      - name: The example reproduces its tracked output
        run: |
          set -euxo pipefail
          cd example
          ../src/adze small_paramfile.txt
          cd ..
          git diff --exit-code -- example/ ':(exclude)example/*summary*'

      - name: Show what differs, when something does
        if: failure()
        run: git diff -- example/

  windows:
    name: MSYS2 MINGW64
    runs-on: windows-latest
    defaults:
      run:
        # Every run block below is MSYS2 bash, so the shell is the same one a
        # user following the build instructions on Windows would be in.
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          # No gsl: the differential suite does not run here (see below), and
          # 2.0 itself needs no external library.
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python

      # No ADZE_REFERENCE, so ctest runs docs, formats and windows and skips
      # the differential suite. That is deliberate. ADZE 1.0's
      # Population::putNj stores its value and then falls off the end of a
      # bool function -- undefined behaviour, which its own Makefile hides with
      # -w ("non-void function does not return a value in all control paths").
      # In the mingw-w64 build the store does not survive, so every Nj stays 0,
      # every statistic is undefined at every g, and the legacy layout omits
      # undefined rows: 1.0 there writes headers and no numbers, reports no
      # error, and the run summary still matches. Removing that store from a
      # local 1.0 build reproduces the Windows output exactly, console line
      # included. There is nothing to compare against, so 2.0's agreement with
      # 1.0 is established on Linux and macOS, where 1.0's arithmetic is
      # well defined. (A Windows differential run is possible against a 1.0
      # patched to return -- but that is a patched reference, and the claim
      # would have to say so.)
      - name: Configure and build
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j
          ./build/adze.exe --version

      - name: Run the suites
        run: ctest --test-dir build --output-on-failure

      # What the differential suite cannot check here, this does: the numbers
      # this build writes are compared with committed output generated on
      # another platform. example/ is `text eol=lf` in .gitattributes, so git
      # normalizes the CRLF this build writes and the comparison is about
      # content. The run summary records per-phase durations and is excluded.
      - name: The distributed example reproduces its tracked output
        run: |
          set -euxo pipefail
          cd example
          ../build/adze.exe small_paramfile.txt
          cd ..
          git diff --exit-code -- example/ ':(exclude)example/*summary*'

      - name: Show what differs, when something does
        if: failure()
        run: git diff -- example/

      # The Makefile path matters more on Windows than elsewhere: MSYS2 users
      # reach for make, and CMake's Ninja generator hides Makefile breakage.
      - name: Build with the plain Makefile
        run: |
          set -euxo pipefail
          make -C src ZLIB=1 TARGET=adze.exe
          ./src/adze.exe --version
          python3 test/formats.py --candidate src/adze.exe

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: scratch-windows
          path: |
            build/formats
            build/windows
          if-no-files-found: ignore

  manual:
    name: manual
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install a LaTeX toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended

      # docs.py needs no binary: it holds the README's option table to the
      # OPTIONS table in the source.
      - name: The documentation agrees with the option table
        run: python3 test/docs.py

      - name: Build the manual
        run: |
          set -euxo pipefail
          make -C doc
          test -f doc/ADZE_Manual.pdf
          # Informational: line breaking depends on the TeX version, so this is
          # reported rather than enforced.
          echo "overfull lines: $(grep -cE '^Overfull' doc/ADZE_Manual.log || true)"

      - uses: actions/upload-artifact@v4
        with:
          name: ADZE_Manual
          path: doc/ADZE_Manual.pdf
          if-no-files-found: error
